org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Relax Kotlin/Java JVM-target consistency check: some plugins still compile Java at 1.8
# while KGP 2.2+ targets the build JDK (21). Downgrades the hard error to a warning.
kotlin.jvm.target.validation.mode=warning

# CUSTOM: project on D: and pub cache on C: break Kotlin incremental caches on Windows ("different roots")
kotlin.incremental=false

# CUSTOM: AGP 9 rejects getDefaultProguardFile("proguard-android.txt"); flutter_inappwebview_android 1.1.3 (last release) still uses it
android.r8.proguardAndroidTxt.disallowed=false
